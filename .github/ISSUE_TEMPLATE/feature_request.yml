name: Feature request
description: Propose a user or operational problem for the project to solve.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem and desired outcome. A technology is not a feature
        by itself and should be proposed only when it serves a demonstrated need.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and the roadmap for related work.
          required: true
        - label: This request does not include proprietary or confidential information.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who experiences the problem, and what prevents them from succeeding?
      placeholder: As a..., I need..., because...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior without prescribing unnecessary implementation details.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Example use case
      description: Provide a realistic workflow or scenario.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      placeholder: |
        - [ ] Given..., when..., then...
        - [ ] Failure and authorization cases are defined.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or simpler options if known.

  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      description: Select the closest phase; maintainers may change it after review.
      options:
        - Phase 0 - Product and repository foundation
        - Phase 1 - Application foundation
        - Phase 2 - Project and environment management
        - Phase 3 - Simulated build and deployment tracking
        - Phase 4 - Real integrations
        - Phase 5 - Containers and observability
        - Phase 6 - Cloud and orchestration
        - Not sure
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Security, operational, or maintenance considerations

