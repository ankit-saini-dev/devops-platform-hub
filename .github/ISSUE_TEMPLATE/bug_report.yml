name: Bug report
description: Report reproducible behavior that differs from the documented or expected result.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, tokens,
        private data, proprietary information, or unredacted sensitive logs.
        Security vulnerabilities must not be reported through this public form.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, private data, and proprietary information.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the problem and its impact clearly.
      placeholder: What happened, and why is it a problem?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start with...
        2. Perform...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, browser, runtime, container, and commit information.
      placeholder: |
        Commit or version:
        Operating system:
        Browser:
        .NET/Node/Docker versions where applicable:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Include only the minimum non-sensitive evidence needed to diagnose the problem.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context

